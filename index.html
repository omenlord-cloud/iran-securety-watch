
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const INTERVAL = 120000;
  const TIMEOUT = 18000;
  const articles = new Map();
  const sourceState = new Map();
  let running = false;
  let nextRunAt = Date.now() + INTERVAL;
  let countdownTimer = null;
  let map = null;
  let markers = null;

  const sources = [
    {
      id: "gdelt",
      name: "GDELT جست‌وجوی جهانی",
      type: "جست‌وجوی خبر",
      url: null
    },
    {
      id: "bbc",
      name: "BBC فارسی",
      type: "RSS",
      url: "https://feeds.bbci.co.uk/persian/rss.xml"
    },
    {
      id: "dw",
      name: "دویچه‌وله فارسی",
      type: "RSS",
      url: "https://rss.dw.com/rdf/rss-fa-all"
    },
    {
      id: "aljazeera",
      name: "الجزیره",
      type: "RSS",
      url: "https://www.aljazeera.com/xml/rss/all.xml"
    },
    {
      id: "guardian",
      name: "گاردین",
      type: "RSS",
      url: "https://www.theguardian.com/world/rss"
    }
  ];

  const iranTerms = [
    "iran", "iranian", "tehran", "persian gulf",
    "strait of hormuz", "ایران", "تهران",
    "خلیج فارس", "تنگه هرمز", "بندرعباس"
  ];

  const securityTerms = [
    "attack", "strike", "missile", "drone", "explosion",
    "military", "war", "tanker", "airstrike",
    "حمله", "موشک", "پهپاد", "انفجار", "درگیری",
    "نفتکش", "جنگ", "حمله هوایی", "تنگه هرمز"
  ];

  const cities = [
    ["تهران",35.6892,51.3890,["tehran","تهران"]],
    ["بندرعباس",27.1832,56.2666,["bandar abbas","بندرعباس"]],
    ["چابهار",25.2919,60.6430,["chabahar","چابهار"]],
    ["بوشهر",28.9234,50.8203,["bushehr","بوشهر"]],
    ["اهواز",31.3183,48.6706,["ahvaz","ahwaz","اهواز"]],
    ["اصفهان",32.6546,51.6680,["isfahan","اصفهان"]],
    ["تبریز",38.0962,46.2738,["tabriz","تبریز"]],
    ["مشهد",36.2972,59.6067,["mashhad","مشهد"]],
    ["زاهدان",29.4963,60.8629,["zahedan","زاهدان"]],
    ["کرمان",30.2839,57.0834,["kerman","کرمان"]],
    ["قشم",26.9581,56.2719,["qeshm","قشم"]],
    ["کیش",26.5320,53.9770,["kish island","کیش"]]
  ];

  function clean(value) {
    const doc = new DOMParser().parseFromString(
      String(value || ""), "text/html"
    );
    return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
  }

  function isIran(a) {
    const s = (a.title + " " + a.description).toLowerCase();
    return iranTerms.some(t => s.includes(t));
  }

  function isSecurity(a) {
    const s = (a.title + " " + a.description).toLowerCase();
    return securityTerms.some(t => s.includes(t));
  }

  function findCity(a) {
    const s = (a.title + " " + a.description).toLowerCase();
    return cities.find(c => c[3].some(t => s.includes(t))) || null;
  }

  function safeURL(value) {
    try {
      const u = new URL(value);
      return ["https:", "http:"].includes(u.protocol) ? u.href : "";
    } catch (_) {
      return "";
    }
  }

  function parseDate(value) {
    if (!value) return "";
    if (/^\d{8}T\d{6}Z?$/.test(value)) {
      const s = value.replace("T", "");
      return s.slice(0,4) + "-" + s.slice(4,6) + "-" +
        s.slice(6,8) + "T" + s.slice(8,10) + ":" +
        s.slice(10,12) + ":" + s.slice(12,14) + "Z";
    }
    return value;
  }

  function timeText(value) {
    const d = new Date(parseDate(value));
    if (!value || Number.isNaN(d.getTime())) return "زمان انتشار نامشخص";
    return d.toLocaleString("fa-IR", {
      dateStyle:"short", timeStyle:"short"
    });
  }

  function addArticle(a) {
    const url = safeURL(a.url);
    if (!url || !a.title) return;

    const item = {
      ...a,
      url,
      title: clean(a.title),
      description: clean(a.description || "")
    };

    if (!item.title) return;

    // حذف خبرهای تکراری با لینک یکسان
    if (!articles.has(url)) {
      articles.set(url, item);
    } else {
      const old = articles.get(url);
      if (item.description.length > old.description.length) {
        articles.set(url, {...old, description:item.description});
      }
    }
  }

  async function fetchJSON(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT);

    try {
      const response = await fetch(url, {
        signal: controller.signal,
        cache: "no-store"
      });
      if (!response.ok) throw new Error("HTTP " + response.status);
      return await response.json();
    } finally {
      clearTimeout(timer);
    }
  }

  async function loadGDELT() {
    const q = encodeURIComponent(
      '(Iran OR Iranian OR Tehran OR "Persian Gulf" OR "Strait of Hormuz")'
    );
    const url = "https://api.gdeltproject.org/api/v2/doc/doc" +
      "?query=" + q +
      "&mode=ArtList&format=json&sort=HybridRel&maxrecords=75&timespan=24h";

    const data = await fetchJSON(url);
    if (!Array.isArray(data.articles)) {
      throw new Error("پاسخ قابل‌استفاده دریافت نشد");
    }

    data.articles.forEach(a => addArticle({
      title: a.title,
      description: "",
      url: a.url,
      source: a.domain || "GDELT",
      date: a.seendate || "",
      method: "GDELT"
    }));

    return data.articles.length;
  }

  async function loadRSS(source) {
    // این سرویس واسط عمومی است و ممکن است محدود یا موقتاً قطع شود.
    const endpoint = "https://api.rss2json.com/v1/api.json?rss_url=" +
      encodeURIComponent(source.url);

    const data = await fetchJSON(endpoint);
    if (data.status !== "ok" || !Array.isArray(data.items)) {
      throw new Error("خوراک RSS در دسترس نیست");
    }

    data.items.forEach(a => addArticle({
      title: a.title,
      description: clean(a.description || a.content || ""),
      url: a.link,
      source: source.name,
      date: a.pubDate || "",
      method: "RSS"
    }));

    return data.items.length;
  }

  function ensureSourcePanel() {
    if ($("sourcePanel")) return;

    const panel = document.createElement("section");
    panel.id = "sourcePanel";
    panel.style.cssText =
      "background:#101d2d;color:#edf4ff;border:1px solid #26384d;" +
      "border-radius:12px;padding:14px;margin:14px 0;font-family:Tahoma,Arial";

    const heading = document.createElement("h2");
    heading.textContent = "وضعیت واقعی منابع";
    heading.style.fontSize = "17px";

    const info = document.createElement("p");
    info.id = "sourceSummary";
    info.textContent = "هنوز بررسی انجام نشده است.";
    info.style.cssText = "font-size:13px;color:#b5c5d8";

    const grid = document.createElement("div");
    grid.id = "sourceGrid";
    grid.style.cssText =
      "display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px";

    const channels = document.createElement("p");
    channels.style.cssText = "font-size:12px;color:#b5c5d8";
    channels.textContent =
      "تلگرام: ۰ کانال متصل | بله: ۰ کانال متصل | روبیکا: ۰ کانال متصل. " +
      "این منابع هنوز اتصال عملیاتی ندارند و در آمار پایش حساب نمی‌شوند.";

    panel.append(heading, info, grid, channels);

    const mapPanel = $("map")?.closest(".panel");
    if (mapPanel) mapPanel.parentNode.insertBefore(panel, mapPanel);
    else document.body.prepend(panel);
  }

  function renderSourcePanel() {
    ensureSourcePanel();

    const grid = $("sourceGrid");
    grid.replaceChildren();

    let ok = 0;
    let fail = 0;

    sources.forEach(s => {
      const state = sourceState.get(s.id) || {
        status:"pending", count:0, message:"در انتظار بررسی"
      };

      if (state.status === "ok") ok++;
      if (state.status === "error") fail++;

      const card = document.createElement("div");
      card.style.cssText =
        "background:#0a1625;border:1px solid #26384d;border-radius:8px;padding:10px";

      const name = document.createElement("strong");
      name.textContent = s.name;
      name.style.display = "block";

      const status = document.createElement("div");
      status.style.cssText = "font-size:12px;margin-top:4px";
      status.style.color =
        state.status === "ok" ? "#65d6a0" :
        state.status === "error" ? "#ff7777" : "#e9bd65";

      const label = state.status === "ok" ? "پاسخ‌گو" :
        state.status === "error" ? "خطا / بدون پاسخ" : "در انتظار";

      status.textContent = label + " · " + state.message;

      card.append(name, status);
      grid.appendChild(card);
    });

    $("sourceSummary").textContent =
      "منابع بررسی‌شده: " + (ok + fail) + " از " + sources.length +
      " | موفق: " + ok + " | ناموفق: " + fail +
      " | این شمارش فقط مربوط به منابع تعریف‌شده در کد است.";
  }

  function renderMap(list) {
    if (!window.L || !$("map")) return;

    if (!map) {
      map = L.map("map").setView([32.5, 53.5], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:18,
        attribution:"&copy; OpenStreetMap contributors"
      }).addTo(map);
      markers = L.layerGroup().addTo(map);
    }

    markers.clearLayers();

    const groups = new Map();
    list.forEach(a => {
      const city = findCity(a);
      if (!city) return;
      if (!groups.has(city[0])) groups.set(city[0], {city, items:[]});
      groups.get(city[0]).items.push(a);
    });

    groups.forEach(g => {
      const marker = L.circleMarker([g.city[1], g.city[2]], {
        radius:7, color:"#e9bd65", fillColor:"#d84b4b",
        fillOpacity:.75, weight:2
      });

      const popup = document.createElement("div");
      const heading = document.createElement("strong");
      heading.textContent = g.city[0];
      popup.appendChild(heading);

      const note = document.createElement("p");
      note.textContent = "نام این شهر در " + g.items.length +
        " خبر دیده شده است؛ محل وقوع رویداد تأیید نشده.";
      popup.appendChild(note);

      g.items.slice(0,5).forEach(a => {
        const p = document.createElement("p");
        const link = document.createElement("a");
        link.href = a.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = a.title;
        p.appendChild(link);
        popup.appendChild(p);
      });

      marker.bindPopup(popup);
      marker.addTo(markers);
    });
  }

  function render() {
    const term = ($("search")?.value || "").trim().toLowerCase();
    const filter = $("filter")?.value || "all";

    const all = [...articles.values()].sort((a,b) =>
      new Date(parseDate(b.date) || 0) - new Date(parseDate(a.date) || 0)
    );

    const filtered = all.filter(a => {
      const text = (a.title + " " + a.description + " " + a.source).toLowerCase();
      if (term && !text.includes(term)) return false;
      if (filter === "iran" && !isIran(a)) return false;
      if (filter === "security" && !isSecurity(a)) return false;
      return true;
    });

    if ($("total")) $("total").textContent = all.length.toLocaleString("fa-IR");
    if ($("iranCount")) {
      $("iranCount").textContent = all.filter(isIran).length.toLocaleString("fa-IR");
    }
    if ($("countText")) {
      $("countText").textContent =
        filtered.length.toLocaleString("fa-IR") + " خبر در فهرست.";
    }

    const list = $("newsList");
    if (list) {
      list.replaceChildren();

      if (!filtered.length) {
        const p = document.createElement("p");
        p.textContent =
          "هنوز خبری دریافت نشده یا منابع پاسخ نداده‌اند. وضعیت منابع بالا را بررسی کنید.";
        list.appendChild(p);
      }

      filtered.forEach(a => {
        const card = document.createElement("article");
        card.style.cssText =
          "background:#101d2d;color:#edf4ff;border:1px solid #26384d;" +
          "border-radius:12px;padding:14px;margin:10px 0";

        const meta = document.createElement("div");
        meta.style.cssText = "font-size:12px;color:#b5c5d8";
        meta.textContent = a.source + " · " + timeText(a.date) +
          " · " + (isIran(a) ? "مرتبط با ایران" : "بین‌المللی");
        card.appendChild(meta);

        const h = document.createElement("h3");
        h.style.fontSize = "16px";
        const link = document.createElement("a");
        link.href = a.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = a.title;
        h.appendChild(link);
        card.appendChild(h);

        const summary = document.createElement("p");
        summary.style.fontSize = "14px";
        summary.textContent = a.description
          ? "متن/خلاصه دریافتی از منبع: " + a.description.slice(0,650)
          : "متن کامل یا خلاصه از این منبع دریافت نشده؛ برای جزئیات، گزارش اصلی را باز کنید.";
        card.appendChild(summary);

        const city = findCity(a);
        if (city) {
          const loc = document.createElement("p");
          loc.style.cssText = "font-size:12px;color:#e9bd65";
          loc.textContent = "نام مکان در متن: " + city[0] +
            "؛ این تشخیص خودکار تأیید محل حادثه نیست.";
          card.appendChild(loc);
        }

        card.appendChild(document.createElement("hr"));
        const original = document.createElement("a");
        original.href = a.url;
        original.target = "_blank";
        original.rel = "noopener noreferrer";
        original.textContent = "مشاهده گزارش اصلی";
        card.appendChild(original);

        list.appendChild(card);
      });
    }

    renderMap(all);
  }

  async function refresh() {
    if (running) return;
    running = true;

    if ($("status")) $("status").textContent = "در حال جست‌وجو و دریافت خبرها...";

    await Promise.all(sources.map(async s => {
      sourceState.set(s.id, {
        status:"pending", count:0, message:"در حال بررسی"
      });
      renderSourcePanel();

      try {
        const count = s.id === "gdelt"
          ? await loadGDELT()
          : await loadRSS(s);

        sourceState.set(s.id, {
          status:"ok", count,
          message: count + " مورد دریافتی"
        });
      } catch (e) {
        sourceState.set(s.id, {
          status:"error", count:0,
          message: e && e.name === "AbortError"
            ? "پایان مهلت انتظار"
            : "دریافت ناموفق"
        });
      }

      renderSourcePanel();
    }));

    render();

    if ($("updated")) {
      $("updated").textContent = new Date().toLocaleTimeString("fa-IR", {
        hour:"2-digit", minute:"2-digit"
      });
    }

    const successful = [...sourceState.values()].filter(s => s.status === "ok").length;

    if ($("status")) {
      $("status").textContent = successful
        ? "بررسی تمام شد؛ منابع موفق: " + successful + " از " + sources.length
        : "هیچ منبعی پاسخ موفق نداد؛ وضعیت منابع را بررسی کنید.";
    }

    nextRunAt = Date.now() + INTERVAL;
    running = false;
  }

  function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);

    countdownTimer = setInterval(() => {
      if (running) return;

      const seconds = Math.max(0, Math.ceil((nextRunAt - Date.now()) / 1000));
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;

      if ($("status") && seconds > 0) {
        $("status").textContent =
          "بررسی بعدی در " + String(m).padStart(2,"0") +
          ":" + String(s).padStart(2,"0");
      }

      if (seconds <= 0 && !running) refresh();
    }, 1000);
  }

  ensureSourcePanel();

  $("refresh")?.addEventListener("click", refresh);
  $("search")?.addEventListener("input", render);
  $("filter")?.addEventListener("change", render);

  renderSourcePanel();
  refresh();
  startCountdown();

  // تلاش دوره‌ای تا وقتی صفحه باز است؛ پایش پس‌زمینه نیست.
  setInterval(() => {
    if (!running) refresh();
  }, INTERVAL);
})();
</script>
